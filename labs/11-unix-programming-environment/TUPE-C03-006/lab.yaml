contract_version: 1
id: TUPE-C03-006
title: Dynamic Command Report
version: 1
module: unix-programming-environment
difficulty: beginner

learning_objectives:
  - Use the output of one command as input to another command invocation.
  - Preserve command output containing spaces and shell metacharacters as one argument.
  - Accept command paths as positional parameters instead of hard-coding them.
  - Redirect generated command output to a requested file.
  - Produce repeatable output without modifying provided helper commands.

submission:
  filename: dynamic_report.sh
  interpreter: bash

environment:
  image: cyberrange/rhsa-base:0.3
  build_context: docker/base
  timeout_seconds: 15
  memory: 512m
  cpus: 1.0
  pids_limit: 128
  network: none

variables:
  TEST_TOKEN:
    type: random_token
  BUILD_A:
    type: random_int
    min: 100
    max: 499
  BUILD_B:
    type: random_int
    min: 500
    max: 999

execution:
  command:
    - bash
    - -c
    - |
      set -e
      output_a=$1
      output_b=$2
      producer_a=$3
      producer_b=$4
      formatter=$5

      bash /submission/dynamic_report.sh \
        "$output_a" \
        "$producer_a" \
        "$formatter"

      bash /submission/dynamic_report.sh \
        "$output_b" \
        "$producer_b" \
        "$formatter"
    - _
    - "/workspace/dynamic_a_${TEST_TOKEN}.txt"
    - "/workspace/dynamic_b_${TEST_TOKEN}.txt"
    - "/workspace/producer_a_${TEST_TOKEN}"
    - "/workspace/producer_b_${TEST_TOKEN}"
    - "/workspace/formatter_${TEST_TOKEN}"
  repeat_for_idempotency: true

grading:
  total_points: 100
  pass_score: 70
  criteria:
    - id: syntax
      points: 5
    - id: first_run_exit
      points: 5
    - id: outputs_created
      points: 10
    - id: first_dynamic_value
      points: 20
    - id: second_dynamic_value
      points: 20
    - id: literal_preservation
      points: 15
    - id: helpers_preserved
      points: 10
    - id: idempotency
      points: 15
